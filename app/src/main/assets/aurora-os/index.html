<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurora OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%237C9EFF%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ BOOT SCREEN ============ -->
<div id="boot-screen" class="screen">
  <div class="boot-center">
    <div class="aurora-ring">
      <svg viewBox="0 0 120 120" width="96" height="96">
        <circle cx="60" cy="60" r="50" class="ring-track"/>
        <circle cx="60" cy="60" r="50" class="ring-progress"/>
      </svg>
    </div>
    <div class="boot-word">AURORA<span>OS</span></div>
    <div class="boot-status" id="boot-status">Initializing kernel…</div>
  </div>
  <div class="boot-footer">v1.0 · web edition</div>
</div>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock-screen" class="screen hidden">
  <div class="lock-time" id="lock-time">00:00</div>
  <div class="lock-date" id="lock-date">Monday, January 1</div>
  <div class="lock-hint" id="lock-hint">Click anywhere or press any key to unlock</div>
  <div class="lock-user">
    <div class="lock-avatar">A</div>
    <div class="lock-username">Guest</div>
  </div>
</div>

<!-- ============ DESKTOP ============ -->
<div id="desktop-screen" class="screen hidden">
  <div id="desktop" class="desktop">
    <div id="desktop-icons" class="desktop-icons"></div>
    <div id="widgets-layer" class="widgets-layer"></div>
    <div id="windows-layer" class="windows-layer"></div>
    <div id="remote-cursor"></div>
  </div>

  <!-- Context menu -->
  <div id="context-menu" class="context-menu hidden"></div>

  <!-- Notification toasts -->
  <div id="toast-layer" class="toast-layer"></div>

  <!-- Start Menu -->
  <div id="start-menu" class="start-menu hidden">
    <div class="start-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="start-search-input" type="text" placeholder="Search apps and files">
    </div>
    <div class="start-section-label"><span>Pinned</span><span class="see-all" id="start-see-all">All apps ></span></div>
    <div id="start-apps-grid" class="start-apps-grid"></div>
    <div class="start-section-label"><span>Recommended</span></div>
    <div class="start-recommended" id="start-recommended"></div>
    <div class="start-footer">
      <div class="start-user"><div class="lock-avatar small">A</div><span>Guest</span></div>
      <button id="start-power" class="icon-btn" title="Power">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Quick settings panel -->
  <div id="quick-panel" class="quick-panel hidden">
    <div class="quick-toggles">
      <button class="qtoggle active" data-toggle="wifi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
        <span>Wi-Fi</span>
      </button>
      <button class="qtoggle active" data-toggle="bt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5 17.5 15l-5.5 4.5v-15L17.5 9 6.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Bluetooth</span>
      </button>
      <button class="qtoggle" id="theme-toggle-btn" data-toggle="theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Dark mode</span>
      </button>
      <button class="qtoggle" id="dnd-btn" data-toggle="dnd">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M7 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Focus</span>
      </button>
    </div>
    <div class="quick-slider-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18V6l8 6-8 6Z" fill="currentColor" opacity=".0"/><path d="M11 5 6 9H3v6h3l5 4V5ZM16 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <input type="range" id="volume-slider" min="0" max="100" value="70">
    </div>
    <div class="quick-slider-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="range" id="brightness-slider" min="10" max="100" value="90">
    </div>
    <div class="quick-battery">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="8" width="17" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="20" y="10" width="2" height="4" fill="currentColor"/><rect x="4" y="10" width="12" height="4" fill="currentColor"/></svg>
      <span>84% · Power saver off</span>
    </div>
  </div>

  <!-- Task view / virtual desktop switcher -->
  <div id="taskview-panel" class="taskview-panel hidden">
    <div class="taskview-header">
      <span>Desktops</span>
      <button id="taskview-add" class="icon-btn" title="New desktop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="taskview-list" class="taskview-list"></div>
  </div>

  <!-- Notification center -->
  <div id="notif-panel" class="notif-panel hidden">
    <div class="notif-panel-header"><span>Notifications</span><button id="clear-notifs">Clear all</button></div>
    <div id="notif-list" class="notif-list"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar" class="taskbar">
    <div class="taskbar-center">
      <button id="start-btn" class="taskbar-btn start-btn" title="Start">
        <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button id="search-btn" class="search-pill" title="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span>
      </button>
      <button id="taskview-btn" class="taskbar-btn" title="Task view (virtual desktops)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div id="running-apps" class="running-apps"></div>
    </div>
    <div class="taskbar-tray">
      <button id="notif-btn" class="taskbar-btn" title="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 16a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="2"/></svg>
        <span id="notif-dot" class="notif-dot hidden"></span>
      </button>
      <button id="quick-panel-btn" class="tray-cluster" title="Quick settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="8" width="17" height="8" rx="2" stroke="currentColor" stroke-width="2"/><rect x="4" y="10" width="12" height="4" fill="currentColor"/></svg>
      </button>
      <button id="clock-btn" class="taskbar-btn clock-btn" title="Date and time">
        <span id="taskbar-clock">00:00</span>
        <span id="taskbar-date">Mon 1/1</span>
      </button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/eventbus.js"></script>
<script src="js/icons.js"></script>
<script src="js/apps.js"></script>
<script src="js/notifications.js"></script>
<script src="js/window.js"></script>
<script src="js/desktop.js"></script>
<script src="js/desktops.js"></script>
<script src="js/taskbar.js"></script>
<script src="js/input.js"></script>
<script src="js/lockscreen.js"></script>
<script src="js/boot.js"></script>
<script src="js/apps/notepad.js"></script>
<script src="js/apps/explorer.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/apps/calculator.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/browser.js"></script>
<script src="js/apps/paint.js"></script>
<script src="js/apps/gallery.js"></script>
<script src="js/apps/recyclebin.js"></script>
<script src="js/apps/clock.js"></script>
<script src="js/apps/minesweeper.js"></script>
<script src="js/apps/game2048.js"></script>
<script src="js/apps/aboutme.js"></script>
<script src="js/main.js"></script>
<script src="js/remote-cursor.js"></script>
</body>
</html>
